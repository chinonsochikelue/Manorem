# Virtual workspace root. There is no root distribution on purpose: every unit of
# code lives in packages/* so the sandboxed render worker can install the engine
# without dragging in API/service dependencies.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/core/src", "packages/ir/src", "packages/skills/src", "packages/compiler/src", "packages/renderer/src", "packages/compositor/src", "packages/ai/src", "packages/cli/src"]
extend-exclude = ["media", "examples/scratch"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH",
    "TID", "PIE", "RUF", "ANN", "PL", "TRY", "FBT",
]
ignore = [
    "ANN401",   # Any is legitimate at provider/JSON boundaries
    "PLR0911",  # exhaustive match over a discriminated union returns once per arm
    "PLR0912",  # ditto: one branch per union member is the point, not accidental
    "PLR0913",  # explicit keyword-heavy constructors are the house style
    "PLR2004",  # magic values are fine in tests and geometry
    "TRY003",   # long messages inside raise are more useful than exception subclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "ARG", "FBT"]
# A CLI's boolean --flags are the interface, not a boolean-trap smell; Typer needs
# them as command-signature defaults, so FBT does not apply to the command module.
# For the same reason a verb's positional-arg count tracks its number of options, not
# a design smell, so PLR0917 is off here too.
"packages/cli/src/manorem_cli/app.py" = ["FBT", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
# Typer builds every argument spec by calling Argument/Option in the default -- that
# is the framework's contract, not an accidental mutable default, so B008 is wrong here.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
strict = true
files = ["packages", "tests"]
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/core/src", "packages/ir/src", "packages/skills/src",
    "packages/compiler/src", "packages/renderer/src", "packages/compositor/src",
    "packages/ai/src", "packages/cli/src",
]
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["manim.*", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ``PlanScene`` must subclass Manim's ``MovingCameraScene``, which is ``Any`` here
# because Manim is deliberately not type-followed (see the override above). This is
# the single file on the render path that touches Manim, so the relaxation is scoped
# to it rather than weakening the strict base config globally.
[[tool.mypy.overrides]]
module = ["manorem_renderer.manim.plan_scene"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: real Manim renders and golden-frame comparisons (excluded from the default run)",
    "network: requires a live provider API key (never run in CI)",
]
filterwarnings = ["error::DeprecationWarning:manorem_.*"]
