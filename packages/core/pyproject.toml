[project]
name = "manorem-core"
version = "0.1.0"
description = "Cross-cutting primitives: settings, logging, diagnostics, storage, canonical hashing."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
