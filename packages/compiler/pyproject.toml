[project]
name = "manorem-compiler"
version = "0.1.0"
description = "Deterministic Visual IR to RenderPlan compiler: layout, scheduling, lowering."
requires-python = ">=3.13"
dependencies = [
    "manorem-core",
    "manorem-ir",
    "manorem-skills",
    "pydantic>=2.9",
]

[tool.uv.sources]
manorem-core = { workspace = true }
manorem-ir = { workspace = true }
manorem-skills = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
