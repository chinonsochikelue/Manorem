[project]
name = "manorem-skills"
version = "0.1.0"
description = "Visual Skills: pluggable domain vocabularies, layout solvers and semantic constraints."
requires-python = ">=3.13"
dependencies = [
    "manorem-core",
    "manorem-ir",
    "pydantic>=2.9",
]

[tool.uv.sources]
manorem-core = { workspace = true }
manorem-ir = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
